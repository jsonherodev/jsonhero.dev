name: Feature request
description: Suggest an idea or an improvement for jsonhero.dev.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [existing requests](https://github.com/jsonherodev/jsonhero.dev/issues?q=is%3Aissue+label%3Aenhancement) first. If yours is already there, a thumbs-up reaction on it helps with prioritising.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or problem rather than the solution, e.g. "I compare two API responses every day and have to spot the differences by eye."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you imagine it working in jsonhero.dev.
  - type: textarea
    id: today
    attributes:
      label: What do you use for this today?
      description: Another tool, a script, or a workaround.
  - type: dropdown
    id: frequency
    attributes:
      label: How often would you use it?
      options:
        - Daily
        - Weekly
        - Occasionally
